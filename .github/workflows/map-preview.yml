name: Map Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'routes/**.geojson'

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post map preview comment
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const base = process.env.BASE_SHA;
            const head = process.env.HEAD_SHA;

            const changed = execSync(
              `git diff --name-only ${base} ${head} -- '*.geojson'`
            ).toString().trim().split('\n').filter(Boolean);

            if (changed.length === 0) return;

            const getContent = (sha, file) => {
              try {
                return execSync(`git show ${sha}:${file}`).toString().trim();
              } catch {
                return null;
              }
            };

            const sections = changed.map(file => {
              const baseContent = getContent(base, file);
              const headContent = getContent(head, file);
              const parts = [`### \`${file}\``];

              if (baseContent) {
                parts.push('**Current**');
                parts.push('```geojson');
                parts.push(baseContent);
                parts.push('```');
              }

              parts.push('**Proposed**');
              parts.push('```geojson');
              parts.push(headContent);
              parts.push('```');

              return parts.join('\n');
            });

            const body = `## Map Preview\n\n${sections.join('\n\n')}`;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.startsWith('## Map Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body,
              });
            }
